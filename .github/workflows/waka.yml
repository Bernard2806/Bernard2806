name: Waka Readme

on:
  schedule:
    - cron: "30 9 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  update-readme:
    name: Update Readme with WakaTime Stats
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' ||
      (github.event.head_commit.author.name != 'github-actions[bot]' &&
      github.event.head_commit.author.name != 'readme-bot')

    permissions:
      contents: write

    steps:
      - name: Generate WakaTime Stats
        uses: anmol098/waka-readme-stats@master

        with:
          # Tokens
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          PUSH_TOKEN: ${{ github.token }}

          # Generales
          LOCALE: es
          SECTION_NAME: waka
          BADGE_STYLE: flat-square
          COMMIT_MESSAGE: "chore: actualizar estadísticas de WakaTime"

          # Formato: barras de texto dentro de bloques ```text```
          # (los <svg> inline no los renderiza GitHub, por eso se veian sin formato)
          BAR_STYLE: text
          SYMBOL_VERSION: "1"

          # Secciones a mostrar
          SHOW_TOTAL_CODE_TIME: "true"
          SHOW_TIMEZONE: "true"
          SHOW_COMMIT: "true"
          SHOW_DAYS_OF_WEEK: "true"
          SHOW_LANGUAGE: "true"
          SHOW_EDITORS: "true"
          SHOW_PROJECTS: "true"
          SHOW_OS: "true"
          SHOW_LANGUAGE_PER_REPO: "true"
          SHOW_UPDATED_DATE: "true"

          # Secciones a ocultar
          SHOW_SHORT_INFO: "false"
          SHOW_PROFILE_VIEWS: "false"
          SHOW_AI_CODE_TIME: "false"
          SHOW_AI_CODING: "false"
          SHOW_LINES_OF_CODE: "false"
          SHOW_LOC_CHART: "false"
