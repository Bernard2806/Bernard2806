name: Debug Waka Models

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Models per day
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          curl -s "https://wakatime.com/api/v1/users/current/summaries?range=Last%207%20Days&api_key=$WAKATIME_API_KEY" -o wa_sum.json
          python3 - <<'EOF'
          import json
          d = json.load(open("wa_sum.json"))
          for day in d.get("data", []):
              g = day.get("grand_total") or {}
              print("date", day.get("range", {}).get("date"), "| secs", g.get("total_seconds"))
              print("  ai_model_breakdown:", json.dumps(g.get("ai_model_breakdown")))
              print("  ai_model_costs     :", json.dumps(g.get("ai_model_costs")))
              print("  ai_model_lines     :", json.dumps(g.get("ai_model_line_changes")))
              print("  in/out:", g.get("ai_input_tokens"), "/", g.get("ai_output_tokens"), "| sessions", g.get("ai_sessions"))
          EOF
