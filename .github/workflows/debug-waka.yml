name: Debug Waka

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Ranges and cumulative totals
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          curl -s "https://wakatime.com/api/v1/users/current/stats/last_7_days?api_key=$WAKATIME_API_KEY" -o wa_week.json
          curl -s "https://wakatime.com/api/v1/users/current/summaries?range=Last%207%20Days&api_key=$WAKATIME_API_KEY" -o wa_sum.json
          python3 - <<'EOF'
          import json
          stats = json.load(open("wa_week.json"))["data"]
          sumr = json.load(open("wa_sum.json"))
          print("stats start/end:", stats.get("start"), "->", stats.get("end"), "| is_including_today:", stats.get("is_including_today"))
          print("summaries start/end:", sumr.get("start"), "->", sumr.get("end"))
          ct = sumr.get("cumulative_total")
          print("cumulative_total keys:", sorted(ct.keys()) if ct else None)
          print("cumulative_total.ai_model_breakdown:", json.dumps(ct.get("ai_model_breakdown") if ct else None))
          print("cumulative_total.total_seconds:", ct.get("total_seconds") if ct else None)
          print("cumulative_total.ai_input_tokens:", ct.get("ai_input_tokens") if ct else None)
          print("cumulative_total.ai_output_tokens:", ct.get("ai_output_tokens") if ct else None)
          print("cumulative_total.ai_model_total_cost:", ct.get("ai_model_total_cost") if ct else None)
          print("cumulative_total.ai_model_costs:", json.dumps(ct.get("ai_model_costs") if ct else None))
          EOF
